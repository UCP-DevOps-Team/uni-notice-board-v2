name: CI Pipeline

on:
    push:
        branches:
            - develop
    pull_request:
        branches:
            - develop
        types:
            - opened
            - synchronize

jobs:
    lint:
        name: HTML & CSS Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"

            - name: Install dependencies
              run: npm i

            - name: Run HTMLHint
              run: npx htmlhint "src/**/*.html"

            - name: Run Stylelint
              run: npx stylelint "styles/**/*.css" --allow-empty-input

    build:
        name: Parcel Build
        needs: lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"

            - name: Install dependencies
              run: npm ci

            - name: Build website using Parcel
              run: npx parcel build src/**/*.html --dist-dir dist --no-cache

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist

    docker-validate:
        name: Docker Build Validation (PR only)
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'

        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist

            - name: Docker build (no push)
              run: docker build -t pr-validation .

    docker:
        name: Docker Build & push
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'push'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/uni-notice-board-v2:latest
